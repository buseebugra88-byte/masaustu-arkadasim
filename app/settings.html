<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Arkadaşım — Ayarlar</title>
<style>
:root {
  --cream: #fffaf0; --paper: #fbf3e2; --bg: #f6eedd; --ink: #5b4636; --ink-soft: #8a7462; --line: #e7d8bf;
  --peach: #f4b3a5; --leaf: #a9c99a; --butter: #f3d58c; --danger: #c2614f;
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); min-height: 100vh; font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
header { -webkit-app-region: drag; padding: 30px 28px 0 28px; display: flex; align-items: flex-end; gap: 22px; }
header h1 { margin: 0 0 12px; font-size: 20px; }
nav { display: flex; gap: 4px; -webkit-app-region: no-drag; }
nav button { border: 0; background: transparent; padding: 9px 16px 11px; border-radius: 14px 14px 0 0; font-weight: 600; color: var(--ink-soft); }
nav button.on { background: var(--cream); color: var(--ink); }
main { background: var(--cream); margin: 0 18px 18px; border-radius: 0 22px 22px 22px; padding: 22px 24px; min-height: calc(100vh - 100px); }
h2 { font-size: 16px; margin: 0 0 4px; }
.muted { color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
.btn { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 15px; font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--paper); }
.btn.main { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.btn.main:hover { background: #4a382a; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 11px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input.field { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 12px; font: inherit; color: var(--ink); outline: none; }
input.field:focus { border-color: #cfb48a; }
.checker { background-color: #fff; background-image: linear-gradient(45deg, #efe6d6 25%, transparent 25%), linear-gradient(-45deg, #efe6d6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #efe6d6 75%), linear-gradient(-45deg, transparent 75%, #efe6d6 75%); background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; }

/* karakter kartları */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 16px; }
.cc { border: 2px solid var(--line); border-radius: 18px; padding: 10px; background: #fff; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; }
.cc:hover { border-color: #d9c39d; transform: translateY(-2px); }
.cc .th { width: 100%; height: 120px; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.cc .th img { max-width: 100%; max-height: 110px; }
.cc b { font-size: 14px; }
.cc .badge { position: absolute; top: 8px; left: 8px; background: var(--butter); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
.cc.add { border-style: dashed; justify-content: center; color: var(--ink-soft); min-height: 190px; background: transparent; }
.cc.add span { font-size: 34px; }

/* detay */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.slot { border: 2px solid var(--line); border-radius: 16px; background: #fff; padding: 9px; display: flex; flex-direction: column; gap: 7px; }
.slot .th { height: 110px; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.slot .th img { max-width: 100%; max-height: 104px; }
.slot .th.empty { color: var(--ink-soft); font-size: 12px; background: var(--paper); }
.slot b { font-size: 13px; } .slot small { color: var(--ink-soft); font-size: 11.5px; }

/* düzenleyici */
.overlay { position: fixed; inset: 0; background: rgba(60, 45, 35, .4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
.modal { background: var(--cream); border-radius: 22px; width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.mh { padding: 16px 20px 10px; display: flex; align-items: center; gap: 10px; }
.mh h2 { margin: 0; }
.mb { display: flex; gap: 18px; padding: 0 20px 18px; min-height: 0; flex: 1; }
.view { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 16px; min-height: 380px; overflow: hidden; position: relative; }
.view canvas { max-width: 100%; max-height: 100%; touch-action: none; }
.view.dark { background: #3e3a36; } .view.desk { background: #b9cfb0; }
.tools { width: 260px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.tool { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
.tool label { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tool input[type=range] { width: 100%; accent-color: #b8916a; }
.seg { display: flex; background: var(--paper); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 6px 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.mf { padding: 12px 20px 16px; display: flex; gap: 10px; justify-content: flex-end; border-top: 2px dashed var(--line); }
.cursor { position: absolute; border: 2px solid rgba(91,70,54,.7); border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); }

/* ayarlar */
.set { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 2px dashed var(--line); max-width: 620px; }
.set:last-child { border-bottom: 0; }
.set label { font-weight: 600; }
.switch { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: #8a6a4e; }
.model { display: flex; gap: 12px; align-items: flex-start; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 11px 13px; cursor: pointer; max-width: 620px; margin-top: 8px; }
.model input { margin-top: 3px; accent-color: #8a6a4e; }
.model.on { border-color: #cfb48a; background: var(--paper); }
.tag { display: inline-block; background: var(--leaf); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; margin-left: 6px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 9px 18px; border-radius: 999px; font-weight: 600; z-index: 20; }
</style>
</head>
<body>
<header>
  <h1>🐣 Arkadaşım</h1>
  <nav>
    <button data-tab="chars" class="on">Arkadaşlarım</button>
    <button data-tab="prefs">Ayarlar</button>
    <button data-tab="brain">Sohbet beyni</button>
  </nav>
</header>
<main>
  <section id="tab-chars"></section>
  <section id="tab-prefs" hidden></section>
  <section id="tab-brain" hidden></section>
</main>
<input type="file" id="file" accept="image/*" hidden>
<div id="modalRoot"></div>
<script type="module" src="settings.js"></script>
</body>
</html>
